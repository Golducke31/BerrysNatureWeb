name: Deploy a GitHub Pages

# Despliega el sitio estático en GitHub Pages (dominio berrysnature.com).
# Solo sube los archivos del sitio: HTML, CSS, JS, assets y academia.
# El backend (server/, api/) NO se sube: vive aparte (Vercel) cuando se active.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el paquete del sitio
        run: |
          mkdir -p _site
          cp *.html _site/
          cp robots.txt sitemap.xml _site/
          cp -r css js assets academia _site/
          cp CNAME .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
