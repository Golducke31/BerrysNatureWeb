# ============================================================
# Berry's Nature — deploy en Netlify
# Web estática + API (Functions) en un solo hosting.
# ============================================================

[build]
  # Paquete estático: solo archivos del sitio (el backend vive en Functions).
  # El empaquetado vive en scripts/build.cjs para que local y Netlify usen
  # exactamente el mismo build (verificable con `npm run build`).
  command = "npm run build"
  publish = "dist"

# ---- Escaneo de secretos de Netlify ----
# Netlify escanea el VALOR de toda variable marcada como "contains secret
# values". Estas tres NO son secretos y sus valores aparecen a propósito en
# el código y en el build, así que hay que excluirlas:
#
#   APP_URL         https://berrysnature.com.ar → canonical, og:url, JSON-LD
#   MAIL_TRANSPORT  "resend" → aparece en mailer.js, README, docs…
#   MAIL_FROM       "Berry's Nature <no-reply@...>" → DEFAULT_FROM en mailer.js
#   GOOGLE_CLIENT_ID / TURNSTILE_SITE_KEY → claves PÚBLICAS que van escritas
#     a propósito en js/config.js (las lee el navegador). Si se marcan como
#     secretas, el escaneo las encuentra en ese archivo y rompe el build.
#
# MAIL_API_KEY, DATABASE_URL, ADMIN_SLUG, ADMIN_GATE_KEY, SESSION_SECRET,
# TURNSTILE_SECRET_KEY y MERCADOPAGO_* SIGUEN escaneándose: son secretos
# reales y no deben filtrarse nunca.
[build.environment]
  # LAB_FILE_KEY, R2_BUCKET, LAB_FILE_BYTES, LAB_PRICE_ARS,
  # LAB_RENEWAL_PRICE_ARS y LAB_DOWNLOAD_TTL_HOURS TAMPOCO son secretos:
  # son configuración del producto (ruta del objeto en R2, nombre del bucket,
  # tamaño del ZIP y precios). Sus valores aparecen a propósito en
  # .env.example y en deploy-lab.md, así que si se marcan como "contains
  # secret values" el escaneo los encuentra ahí y rompe el build (este fue
  # el error real). Se excluyen para no fallar por documentación legítima.
  # SIGUEN escaneándose los secretos reales: DATABASE_URL, ADMIN_SLUG,
  # ADMIN_GATE_KEY, SESSION_SECRET, MERCADOPAGO_*, las claves de R2
  # (ACCOUNT/ACCESS/SECRET) y LAB_LICENSE_PRIVATE_KEY.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,MAIL_TRANSPORT,MAIL_FROM,GOOGLE_CLIENT_ID,TURNSTILE_SITE_KEY,LAB_FILE_KEY,R2_BUCKET,LAB_FILE_BYTES,LAB_PRICE_ARS,LAB_RENEWAL_PRICE_ARS,LAB_DOWNLOAD_TTL_HOURS"
  # Los fixtures de tests usan secretos FALSOS (ej. 'testsessionsecret_...')
  # y no se despliegan: no tiene sentido que bloqueen un deploy.
  #
  # dist/** es el artefacto de build estático (HTML/CSS/JS/imágenes públicas).
  # No contiene secretos reales (lo verificamos), así que lo excluimos del
  # escaneo para no bloquear el deploy por coincidencias en texto inocente.
  SECRETS_SCAN_OMIT_PATHS = "tests/**,dist/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # El panel admin lee estos dos archivos desde la Function (ruta secreta).
  # tienda.html se lee desde la Function para inyectarle el JSON-LD del
  # catálogo (precio/stock reales desde la BD) antes de servirla.
  included_files = ["css/admin.css", "js/admin.js", "tienda.html"]

# ---- La tienda cambió de URL ----
# /marca.html → /tienda.html. 301 permanente (no 302) para que Google
# transfiera la autoridad de la URL vieja y los links ya compartidos sigan
# funcionando. force = true porque el archivo viejo ya no existe: si no,
# Netlify intentaría servirlo y devolvería 404.
[[redirects]]
  from = "/marca.html"
  to = "/tienda.html"
  status = 301
  force = true

# ---- API: todo /api/* va a la Function (mismo router que Vercel) ----
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ---- URLs lindas renderizadas por el servidor (igual que en Vercel) ----
[[redirects]]
  from = "/guias/*"
  to = "/.netlify/functions/api/guias/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/foro/hilo/*"
  to = "/.netlify/functions/api/foro/hilo/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/perfil/*"
  to = "/.netlify/functions/api/perfil/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/productos/*"
  to = "/.netlify/functions/api/productos/:splat"
  status = 200
  force = true

# La tienda se sirve desde la Function para inyectarle el JSON-LD del
# catálogo con precios y stock reales (Google lo lee del HTML crudo).
# force = true porque el archivo estático existe y, sin force, Netlify
# lo serviría tal cual (con el JSON-LD viejo sin `price`).
[[redirects]]
  from = "/tienda.html"
  to = "/.netlify/functions/api/tienda"
  status = 200
  force = true

# El sitemap ahora es dinámico (SSR /api/sitemap): lista productos, guías e
# hilos desde la base. El archivo estático sitemap.xml queda sombreado por
# este rewrite (force=true).
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap"
  status = 200
  force = true

# Feed de productos para Google Merchant Center (Google Shopping).
# Mismo patrón que el sitemap: se genera desde la BD en la Function.
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/api/feed"
  status = 200
  force = true

# ---- Assets del panel: nunca públicos (se sirven por /api/<slug>/_/...) ----
[[redirects]]
  from = "/css/admin.css"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/js/admin.js"
  to = "/404.html"
  status = 404

# ---- Cabeceras de seguridad (igual que vercel.json) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://accounts.google.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://accounts.google.com https://challenges.cloudflare.com; frame-src https://accounts.google.com https://challenges.cloudflare.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, max-age=0"

# El HTML de las páginas (incluidas las renderizadas en el servidor) ya va
# con no-store, pero los assets de cliente (js/css) podían quedar cacheados
# por el navegador y servir una versión vieja del sitio después de un deploy.
# Forzamos revalidación para que cada deploy entregue el JS/CSS nuevo y no
# se queden "pegadas" versiones anteriores (p. ej. un hilo.js que apuntaba a
# una ruta que ya no existe y devolvía 404).
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las imágenes subidas desde el panel NO son datos que cambian: la URL es
# el hash del contenido, así que se pueden cachear para siempre. Sin esta
# regla, el "no-store" de /api/* obligaría a bajar cada foto en cada visita.
[[headers]]
  for = "/api/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
